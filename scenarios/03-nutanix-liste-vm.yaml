version: 1
id: nutanix-liste-vm
name: Inventaire des VM Nutanix
description: Liste les 7 VM AHV du workflow de référence avec leur état et leurs ressources.
example: Donne-moi la liste des VM.
when:
  agent: Jones
  mcp:
    nutanix-official: true
matcher:
  type: regex
  # Les demandes d’extinction doivent rester éligibles au matcher fuzzy.
  value: (?!.*(?:[ée]tein|[ée]teind|extinction|arr[êe]t|stop|shutdown|shut down|power off|turn off|lib[ée]r|free.*resources))(?=.*(?:\bvms?\b|machines? virtuelles?|virtual machines?))(?=.*(?:liste|lister|affich|montre|quelles|inventaire|list|show)).*
events:
  - type: thinking
    title: Consulter l’inventaire
    content: Je vais consulter le schéma de l’opération ahv_listVms, puis récupérer les machines virtuelles AHV avec leur état et les ressources attribuées.
    delay: 360
    duration: 1080
  - type: tool
    server: nutanix-official
    name: getOperationSchema
    input:
      operation: ahv_listVms
    output:
      ok: true
      tool: getOperationSchema
      payload:
        operation: ahv_listVms
        method: GET
        path: /vmm/v4.3/ahv/config/vms
        path_parameters: []
        query_parameters:
          - name: $page
            required: false
            description: |
              A URL query parameter that specifies the page number of the result set. It must be a positive integer between 0 and the maximum number of pages that are available for that resource. Any number out of this range might lead to no results. If both $page and $apply query parameters are present, $page will be applied on entities within the groups.
            type: integer
            format: int32
            minimum: 0
          - name: $limit
            required: false
            description: |
              A URL query parameter that specifies the total number of records returned in the result set.  Must be a positive integer between 1 and 100. Any number out of this range will lead to a validation error. If the limit is not provided, a default value of 50 records will be returned in the result set. If both $limit and $apply query parameters are present, $limit  will be applied on entities within the groups. Default value of limit with $apply will be 5.
            type: integer
            format: int32
            minimum: 1
            maximum: 100
          - name: $filter
            required: false
            description: |-
              A URL query parameter that allows clients to filter a collection of resources. The expression specified with $filter is evaluated for each resource in the collection, and only items where the expression evaluates to true are included in the response. Expression specified with the $filter must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html) URL conventions.
              For example, filter **$filter=name eq 'karbon-ntnx-1.0'** would filter the result on cluster name 'karbon-ntnx1.0', filter **$filter=startswith(name, 'C')** would filter on cluster name starting with 'C'. If both $filter and $apply query parameters are present, $filter will be applied on entities within the groups.
            type: string
            odata_fields:
              - apcConfig/cpuModel/extId
              - apcConfig/cpuModel/name
              - apcConfig/isApcEnabled
              - biosUuid
              - categories/extId
              - cluster/extId
              - customAttributes
              - extId
              - gpus/assignedDeviceInfo/device/deviceExtId
              - gpus/backingInfo/PhysicalGpu/physicalGpuProfileReference/extId
              - gpus/backingInfo/VirtualGpu/virtualGpuProfileReference/extId
              - gpus/mode
              - gpus/vendor
              - guestTools/guestInfo/dnsName/value
              - guestTools/guestInfo/guestOsBuildNumber
              - guestTools/guestInfo/installedVirtIoVersion
              - guestTools/guestInfo/lastBootUpTime
              - guestTools/isCommunicationActiveOverSerialPort
              - guestTools/isReachable
              - hardwareClockTimezone
              - host/extId
              - isAgentVm
              - isCpuHotplugEnabled
              - isCpuPassthroughEnabled
              - isGpuConsoleEnabled
              - isLiveMigrateCapable
              - isMemoryOvercommitEnabled
              - isScsiControllerEnabled
              - isVcpuHardPinningEnabled
              - isVgaConsoleEnabled
              - machineType
              - memorySizeBytes
              - name
