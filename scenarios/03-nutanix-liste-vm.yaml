              - guestTools/guestInfo/lastBootUpTime
              - guestTools/guestOsVersion
              - guestTools/isCommunicationActiveOverSerialPort
              - guestTools/isEnabled
              - guestTools/isInstalled
              - guestTools/isIsoInserted
              - guestTools/isReachable
              - guestTools/isVmMobilityDriversInstalled
              - guestTools/isVssSnapshotCapable
              - guestTools/version
              - hardwareClockTimezone
              - host/extId
              - isAgentVm
              - isBrandingEnabled
              - isCpuHotplugEnabled
              - isCpuPassthroughEnabled
              - isCrossClusterMigrationInProgress
              - isGpuConsoleEnabled
              - isLiveMigrateCapable
              - isMemoryOvercommitEnabled
              - isScsiControllerEnabled
              - isVcpuHardPinningEnabled
              - isVgaConsoleEnabled
              - links
              - machineType
              - memorySizeBytes
