version: 1
id: projets-github
name: Recherche de projets GitHub
description: Parcours réussi de recherche des dépôts d’une organisation, commun aux
  MCP GitHub simple et via NAI. Organisation et dépôts fictifs.
example: Peux-tu me lister les projets dans l'organisation Example ?
when:
  agent: Brown
  mcpAny:
    - github
    - github via NAI
matcher:
  type: fuzzy
  keywords:
    - [
        projet,
        projets,
        dépôt,
        dépôts,
        repo,
        repos,
        repository,
        repositories,
        project,
        projects,
        document,
        documents,
      ]
    - [
        lister,
        liste,
        list,
        quels,
        quelles,
        quel,
        quelle,
        chercher,
        cherche,
        rechercher,
        recherche,
        trouver,
        trouve,
        show,
        find,
        search,
      ]
  threshold: 0.8
events:
  - type: thinking
    content: Je vais vérifier mon identité GitHub, puis rechercher les dépôts de
      l'organisation Example.
    duration: 700
  - type: tool
    server: "{{mcpServer}}"
    name: get_me
    input: {}
    output:
      login: example-user
      company: "@example-org"
    status: success
    duration: 500
  - type: tool
    server: "{{mcpServer}}"
    name: search_repositories
    input:
      query: org:example-org
      perPage: 100
      page: 1
      minimal_output: true
      sort: updated
      order: desc
    output:
      total_count: 12
      incomplete_results: false
      items:
