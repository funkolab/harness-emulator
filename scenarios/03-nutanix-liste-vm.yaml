              - nics/nicNetworkInfo/VirtualEthernetNicNetworkInfo/subnet/extId
              - numCoresPerSocket
              - numNumaNodes
              - numSockets
              - numThreadsPerCore
              - ownershipInfo/owner/extId
              - powerState
              - project/extId
              - projectExtId
              - sourceVmProfile/extId
              - storageConfig/hydrationInfo/hydrationStatus
              - storageConfig/storageLocationInfo/storageCluster/extId
          - name: $orderby
            required: false
            description: A URL query parameter that allows clients to specify the sort criteria for the returned list of objects. Resources can be sorted in ascending order using asc or descending order using desc. If asc or desc are not specified, the resources will be sorted in ascending order by default. For example, '$orderby=templateName desc' would get all templates sorted by templateName in descending order. If both $orderby and $apply query parameters are present, $orderby will be applied on entities within the groups.
            type: string
            odata_fields:
              - guestTools/guestInfo/dnsName/value
              - guestTools/guestInfo/installedVirtIoVersion
              - guestTools/guestInfo/lastBootUpTime
              - guestTools/version
              - memorySizeBytes
              - name
              - numCoresPerSocket
              - numNumaNodes
              - numSockets
              - numThreadsPerCore
          - name: $select
            required: false
            description: A URL query parameter that allows clients to request a specific set of properties for each entity or complex type. Expression specified with the $select must conform to the [OData V4.01](https://docs.oasis-open.org/odata/odata/v4.01/odata-v4.01-part1-protocol.html) URL conventions. If a $select expression consists of a single select item that is an asterisk (i.e., *), then all properties on the matching resource will be returned. If both $select and $apply query parameters are present, $select will be applied on entities within the groups.
            type: string
            odata_fields:
